<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude chats</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23d97757'/%3E%3Cpath d='M4 5l3 3-3 3M8.5 11H12' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1>Claude chats</h1>
    <p class="summary" id="summary"></p>
    <div class="usage" id="usage" hidden></div>
    <label class="search">
      <span class="visually-hidden">Filter chats</span>
      <input id="filter" type="search" placeholder="Filter by title or folder  ( / )" autocomplete="off">
    </label>
    <button class="ghost small" id="alerts" hidden title="Get a Mac notification when a chat finishes or needs you">Turn on alerts</button>
    <span class="live" id="live" title="Connection to the dashboard server">Connecting…</span>
  </header>

  <nav class="viewbar" aria-label="View">
    <div class="segmented" role="group" aria-label="Show">
      <button data-show="all">All</button>
      <button data-show="active" title="Needs you, working, or finished and not yet opened">Active</button>
      <button data-show="closed" title="Chats paused with bye-bye (open or not), and chats closed in the last 7 days">Closed</button>
    </div>
    <label class="per-screen" id="per-screen-label">Per screen
      <select id="per-screen">
        <option value="0">All</option>
        <option>4</option><option>6</option><option>8</option><option>10</option><option>12</option><option>16</option>
      </select>
    </label>
    <select id="group-pick" aria-label="Group to show" hidden></select>
    <span id="new-group-slot" class="new-group-slot"><button class="ghost small" id="new-group">+ New group</button></span>
    <div class="pager" id="pager" hidden>
      <button class="ghost small" id="page-prev" aria-label="Previous page" title="Previous page (←)">‹</button>
      <span id="page-label"></span>
      <button class="ghost small" id="page-next" aria-label="Next page" title="Next page (→)">›</button>
    </div>
  </nav>
  <main id="gallery" class="gallery" aria-label="Open chats"></main>
  <section id="closed-view" class="closed-view" hidden aria-label="Closed chats"></section>
  <p id="empty" class="empty" hidden></p>

  <section id="spotlight" class="spotlight" hidden role="dialog" aria-modal="true" aria-labelledby="stage-title">
    <nav class="strip" id="strip" aria-label="Other chats"></nav>
    <div class="stage">
      <header class="stage-head">
        <button class="ghost" id="back" title="Back to all chats (Esc)">← All chats</button>
        <div class="stage-title">
          <h2 id="stage-title"></h2>
          <p id="stage-meta"></p>
          <button class="handle" id="stage-handle" hidden title="Click to copy: type this in another chat to message this one"></button>
        </div>
        <span class="live" id="stage-live"></span>
        <button class="primary" id="raise">Go to ↗</button>
      </header>
      <div class="visually-hidden needs-announcer" aria-live="polite"></div>
      <div class="approval stage-approval" id="stage-approval" hidden></div>
      <ol class="conversation" id="conversation" tabindex="0" aria-label="Conversation"></ol>
    </div>
  </section>

  <div class="visually-hidden needs-announcer" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
